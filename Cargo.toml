[package]
name = "pg-gui"
version = "0.7.0"
edition = "2024"

# Used by `cargo bundle` to produce pg-gui.app with the Dock/Finder icon.
[package.metadata.bundle]
name = "pg-gui"
identifier = "com.gintspolis.pg-gui"
icon = ["assets/icon.icns"]
osx_minimum_system_version = "11.0"

[dependencies]
anyhow = "1"
# Already in the tree via gpui; used for the date in export file names.
chrono = "0.4"
dirs = "6"
futures = "0.3"
# gpui-component moved to the gpui-kit workspace (longbridge/gpui-kit), which
# splits the editing engine into `gpui-base` and takes gpui from crates.io as
# the `gpui-pre` family rather than the zed git tree. gpui and gpui_platform are
# therefore the renamed crates.io packages, pinned to the same 0.3 line
# gpui-kit's workspace uses so a single gpui resolves for the whole graph;
# tree-sitter still lands on 0.26, in lockstep with the pgls fork's
# `bump_treesitter` branch.
gpui = { package = "gpui-pre", version = "0.3.1" }
# gpui split the platform out into its own crate; `gpui_platform::application()`
# replaces the old `Application::new()`. Features match gpui-kit's own.
gpui_platform = { package = "gpui-pre-platform", version = "0.3.1", features = ["font-kit", "x11", "wayland", "runtime_shaders"] }
# The fork carries three input patches pg-gui needs and upstream does not have:
# the clickable breakpoint gutter, `line_number_offset` for body-relative
# routine numbering, and the vertical-selection column fix.
gpui-component = { git = "https://github.com/gintsgints/gpui-kit", branch = "my_fixes3", features = ["tree-sitter-languages"] }
# Must stay in lockstep with the lsp-types version gpui-component uses,
# so our provider impls and its editor traits share the same types.
lsp-types = "0.97"
# The Postgres Language Server, embedded as a library (was: spawned
# `postgrestools lsp-proxy` binary). Points at a fork so a modified server can
# be used. `pgls_workspace` enables its `db` feature by default.
pgls_analyse = { git = "https://github.com/gintsgints/postgres-language-server", branch = "bump_treesitter" }
pgls_completions = { git = "https://github.com/gintsgints/postgres-language-server", branch = "bump_treesitter" }
pgls_configuration = { git = "https://github.com/gintsgints/postgres-language-server", branch = "bump_treesitter" }
pgls_diagnostics = { git = "https://github.com/gintsgints/postgres-language-server", branch = "bump_treesitter" }
pgls_fs = { git = "https://github.com/gintsgints/postgres-language-server", branch = "bump_treesitter" }
pgls_text_size = { git = "https://github.com/gintsgints/postgres-language-server", branch = "bump_treesitter" }
pgls_workspace = { git = "https://github.com/gintsgints/postgres-language-server", branch = "bump_treesitter" }
# PL/pgSQL step debugger over EnterpriseDB's pldebugger (`pldbg_*` proxy API),
# embedded as a library (its `debugger::DebugSession`) rather than spawned as a
# DAP server binary — same "library not binary" approach as the pgls fork above.
pgdap = { git = "https://github.com/gintsgints/pgdap" }
postgres = "0.19"
# Native file-open dialog with a controllable start directory; gpui's
# `prompt_for_paths` can't set one (its Save panel counterpart can, so the
# save/export dialogs stay on gpui).
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
# gpui and tree-sitter are unusably slow without optimized dependencies
opt-level = 3
